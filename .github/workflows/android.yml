name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android APK
        run: dotnet publish src/TCFConsult.Mobile/TCFConsult.Mobile.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TCFConsult-Android-APK
          path: src/TCFConsult.Mobile/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 14